apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-configmap
  namespace: todo-ms
data:
  NODE_ENV: development
  NAMESPACE: todo-ms

  AUTH_MICROSERVICE_DOMAIN: auth-service
  AUTH_MICROSERVICE_PORT: "3006"

  AUTH_DB_USER: user
  AUTH_DB_NAME: todo
  AUTH_DB_HOST: auth-db
  AUTH_DB_PORT: "5432"

  TODO_MICROSERVICE_DOMAIN: todo-service
  TODO_MICROSERVICE_PORT: "3007"

  TODO_DB_USER: user
  TODO_DB_NAME: todo
  TODO_DB_HOST: todo-db
  TODO_DB_PORT: "5432"

  EXTERNAL_DOMAIN: localhost
  ENTRYPOINT_PORT: "3005"

  BCRYPT_SALT_ROUND: "10"

